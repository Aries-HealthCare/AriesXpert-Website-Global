# ==============================================================================
# ARIES HEALTHCARE ECO-SYSTEM — PRODUCTION NGINX REVERSE PROXY CONFIGURATION
# ==============================================================================
# Reference configuration for VPS / Hostinger gateway routing traffic to:
#   - ariesxpert-backend (Port 5001)
#   - AriesXpert-Admin-Dashboard (Next.js Port 3000 / Production)
#   - OmniRoute AI Gateway (Port 20128/20129)
# ==============================================================================

# --- Upstream Cluster Definitions ---
upstream aries_backend_upstream {
    server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream aries_dashboard_upstream {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream aries_omniroute_upstream {
    server 127.0.0.1:20128 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# --- 1. Central API Gateway (api.ariesxpert.com) ---
server {
    listen 80;
    listen [::]:80;
    server_name api.ariesxpert.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.ariesxpert.com;

    # SSL Certificates (managed via Certbot / Hostinger)
    ssl_certificate /etc/letsencrypt/live/api.ariesxpert.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ariesxpert.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50M;

    # Sockets / Realtime Traffic
    location /socket.io/ {
        proxy_pass http://aries_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # REST Endpoints
    location / {
        proxy_pass http://aries_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}

# --- 2. Admin Dashboard (ariesxpert.com) ---
server {
    listen 80;
    listen [::]:80;
    server_name ariesxpert.com www.ariesxpert.com;
    return 301 https://ariesxpert.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ariesxpert.com;

    ssl_certificate /etc/letsencrypt/live/ariesxpert.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ariesxpert.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25M;

    # Next.js Static Asset Caching
    location /_next/static/ {
        proxy_pass http://aries_dashboard_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://aries_dashboard_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
